# =============================================================================
# BỘ CÂU HỎI CHUẨN — 200 ca, dùng làm nguồn duy nhất cho test E2E
# =============================================================================
#
# CÁCH DÙNG
#   1. Anh duyệt và sửa cột kỳ vọng bên dưới (toolBatBuoc / toolCam / phaiCo / camCo)
#   2. Chạy:  npm run test:kichban
#   3. Test đọc THẲNG file này — sửa file là đổi kỳ vọng, không phải sửa code
#
# CÁCH CHẤM (chấm HÀNH VI, không so từng chữ — bot trả lời tự nhiên nên
# không thể khớp nguyên văn)
#
#   toolBatBuoc  Tool BẮT BUỘC phải gọi. Thiếu là FAIL.
#   toolCam      Tool CẤM gọi. Gọi là FAIL.
#   phaiCo       Chuỗi PHẢI có trong câu trả lời (bỏ dấu, không phân biệt hoa
#                thường). Dùng cho số giá: "5.000" khớp "5.000đ/cái".
#   camCo        Chuỗi CẤM xuất hiện. Dùng chặn rò rỉ: "gia von", "0đ".
#   ghiChu       Ghi chú cho người đọc, test bỏ qua.
#
#   Bỏ trống một trường = không kiểm trường đó.
#   Muốn tạm tắt một ca: thêm  bo_qua: true
#
# QUY ƯỚC ĐÃ CHỐT (2026-07-30)
#
#   Vai KHÁCH  — 4 tool: tra_danh_muc, tra_san_pham, tra_ton_kho, chuyen_sale
#                KHÔNG có tao_don_nhap, KHÔNG có tra_khach_hang
#   Vai NHÂN VIÊN — 6 tool (thêm tao_don_nhap, tra_khach_hang), cần tag @bot
#
#   Hàng CHƯA CÓ GIÁ (895 SP): bot NÓI CÓ HÀNG rồi CHUYỂN SALE báo giá.
#     Không báo "0đ", không nói "không có hàng".
#
#   Giá ≤ 10đ là GIÁ ẢO (63 SP để 1đ khi nhập liệu) — đối xử như chưa có giá.
#
# DỮ LIỆU THẬT dùng trong file này (Odoo local nelia_prod, 2026-07-30)
