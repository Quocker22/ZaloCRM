# =============================================================================
# BỘ CÂU HỎI TRI THỨC KỸ THUẬT — 60 ca
# =============================================================================
#
# Bổ sung cho `bo-cau-hoi.yaml` (200 ca về Odoo: giá, tồn, khách, đơn).
# File này phủ tool THỨ 13 `tra_tri_thuc` — đọc datasheet/catalog.
#
# CÁCH DÙNG — giống hệt file kia:
#   1. Anh duyệt và sửa cột kỳ vọng
#   2. CHI_FILE=tri-thuc npm run test:kichban
#
# NGUỒN DỮ LIỆU: 7 PDF trong ~/Downloads/data-led, đã nạp 79 chunk vào
# `knowledge_chunks` (2026-08-02). Đo thật trong DB:
#   IP67 × 4 · IP65 × 2 · Warranty × 7 · 2Y × 1 · CE/RoHS/GS/UL × 4
#
# RANH GIỚI QUAN TRỌNG NHẤT — nhóm `chan-tien` (12 ca):
#   Tool PHẢI TỪ CHỐI mọi câu hỏi về giá/tồn/công nợ. Tài liệu có thể ghi giá
#   CŨ. Đây chính là bug thật đã khiến dự án bỏ RAG: KB cũ chứa giá → bot báo
#   giảm 50% cho khách. Hàng rào nằm trong CODE (`laCauHoiVeTien`), không phải
#   trong prompt — nên nó phải đúng 12/12, không có ngoại lệ.
#
# =============================================================================

